{% extends 'base.html' %}
{% block content %}

<div class="content-box">
  <div class="content-header d-flex justify-content-between align-items-center">
    <h5>Edit Staff Allocation</h5>
    <a href="{% url 'staff_registration' %}" class="btn btn-secondary">← Back</a>
  </div>

  <form method="POST" class="p-3 bg-white rounded shadow-sm">
    {% csrf_token %}
    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Staff</label>
        <select name="staff" class="form-control" required>
          {% for staff in staff_list %}
            <option value="{{ staff.id }}" {% if staff.id == allocation.staff.id %}selected{% endif %}>
              {{ staff.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" name="email" value="{{ allocation.email }}" class="form-control" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Password</label>
        <input type="text" name="password" value="{{ allocation.password }}" class="form-control" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Designation</label>
        <select name="designation" class="form-control" required>
          {% for desig in designations %}
            <option value="{{ desig.id }}" {% if desig.id == allocation.designation.id %}selected{% endif %}>
              {{ desig.Designation }}
            </option>
          {% endfor %}
        </select>
      </div>
<div class="col-md-6">
        <label class="form-label">Branch</label>
        <select name="branch" class="form-control" required>
          {% for branch in branches %}
            <option value="{{ branch.id }}" {% if branch.id == allocation.branch.id %}selected{% endif %}>
              {{ branch.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Department</label>
        <select name="department" class="form-control" required>
          {% for dept in departments %}
            <option value="{{ dept.id }}" {% if dept.id == allocation.department.id %}selected{% endif %}>
              {{ dept.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Status</label>
        <select name="status" class="form-control">
          <option value="active" {% if allocation.status == "active" %}selected{% endif %}>Active</option>
          <option value="inactive" {% if allocation.status == "inactive" %}selected{% endif %}>Inactive</option>
        </select>
      </div>

    </div>

    <div class="mt-4 d-flex justify-content-end gap-2">
      <button type="submit" class="btn btn-primary px-4">Update</button>
      <a href="{% url 'staff_registration' %}" class="btn btn-secondary px-4">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
