{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
  textarea { resize: none; }
</style>

<div class="content-box" id="contentBox">
  <div class="content-header d-flex flex-wrap justify-content-between align-items-center">
    <div class="d-flex align-items-center flex-wrap gap-2">
      <i class="fas fa-store me-2"></i>
      <span class="text-white">Edit Medical Store</span>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-danger btn-sm mx-3" onclick="closeContent()">
        <i class="fas fa-times"></i>
      </a>
    </div>
  </div>

  <div class="content-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Medical Store Name</label>
          <input type="text" class="form-control" name="storeName" id="storeName"
                 value="{{ store.name }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Medical Store Logo</label>
          {% if store.logo %}
            <div class="mb-1">
              <img src="{{ store.logo.url }}" alt="Logo" width="60" height="60" class="rounded border">
            </div>
          {% endif %}
          <input type="file" class="form-control" name="storeLogo" id="storeLogo" accept="image/*">
        </div>

        <div class="col-md-6">
          <label class="form-label">Registration Number</label>
          <input type="text" class="form-control" name="regNo" id="regNo"
                 value="{{ store.registration_number }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">GST Number</label>
          <input type="text" class="form-control" name="gstNo" id="gstNo"
                 value="{{ store.gst_number }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Manager Name</label>
          <input type="text" class="form-control" name="managerName" id="managerName"
                 value="{{ store.manager_name }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Manager Contact No</label>
          <input type="tel" class="form-control" name="managerContact" id="managerContact"
                 pattern="[0-9]{10}" value="{{ store.manager_contact }}" required>
        </div>

        <div class="col-md-12">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" id="email"
                 value="{{ store.email }}" required>
        </div>

        <div class="col-md-12">
          <label class="form-label">Medical Store Address</label>
          <textarea class="form-control" name="storeAddress" id="storeAddress"
                    rows="2" required>{{ store.address }}</textarea>
        </div>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary w-25"><i class="fas fa-check-circle fw-bold me-2 text-white "></i>Update</button>
        <a href="{% url 'medical_store_list' %}" class="btn btn-secondary w-25"><i class="fas fa-arrow-left fw-bold me-2 text-white "></i>Back</a>
      </div>
    </form>
  </div>
</div>

<script>
function closeContent() {
  window.location.href = "{% url 'home' %}";
  document.getElementById("contentBox")?.remove();
}
</script>
{% endblock %}
