{% extends 'Masters.html' %}
{% block contents %}
<div class="content-box" id="contentBox">
  <div class="content-header d-flex justify-content-between align-items-center flex-wrap">
    <div><i class="fas fa-edit me-2"></i>Edit Expense Type</div>
    <a href="{%url 'expensetype_table'%}"><button class="btn btn-secondary">Back</button></a>
  </div>

  <div class="content-body mt-3">
    <form method="POST" class="p-3 border rounded bg-light shadow-sm">
      {% csrf_token %}
      <div class="mb-3">
        <label for="expense_type" class="form-label fw-bold">Expense Type</label>
        <input type="text" name="expense_type" id="expense_type"
               class="form-control"
               value="{{ expense_type.expense_type }}"
               required>
      </div>

      <div class="mb-3">
        <label for="status" class="form-label fw-bold">Status</label>
        <select name="status" id="status" class="form-select">
          <option value="active" {% if expense_type.active == 'active' %}selected{% endif %}>Active</option>
          <option value="inactive" {% if expense_type.active == 'inactive' %}selected{% endif %}>Inactive</option>
        </select>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="submit" class="btn btn-primary fw-bold w-25">
          <i class="fas fa-save me-2"></i>Update
        </button>
        <button type="reset" class="btn btn-danger w-25"
                onclick="window.location.href='{% url 'expensetype_table' %}'">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  function closeContent() {
    window.location.href = "{% url 'expensetype_table' %}";
  }
</script>
{% endblock %}
