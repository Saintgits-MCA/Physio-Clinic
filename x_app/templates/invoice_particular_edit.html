{% extends 'Masters.html' %}
{% block contents %}

<div class="content-box">
  <div class="content-header">
    <span><i class="fas fa-edit me-2"></i>Edit Invoice Particular</span>
  </div>

  <div class="content-body">
    <form method="POST">
      {% csrf_token %}
      <div class="col-md-6 mb-3">
        <label class="form-label">Particular Name</label>
        <input type="text" class="form-control" name="name" value="{{ particular.name }}" required>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary w-25">Update</button>
        <a href="{% url 'invoice_particular_list' %}" class="btn btn-secondary w-25">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
