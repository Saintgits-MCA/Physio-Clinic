{% extends 'base.html' %}
{% block content %}
{% load static %}

<style>
  textarea {
    width: 340px;
  }
</style>

<div class="content-box" id="contentBox">
  <div class="content-header d-flex flex-wrap justify-content-between align-items-center">
    <div class="d-flex align-items-center flex-wrap gap-2">
      <i class="fas fa-user-edit me-2"></i>
      <span class="fw-bold fs-5 text-white">Edit Patient</span>
    </div>
    <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
      <a href="{% url 'patienttable' %}" class="text-white fw-bold text-decoration-none fs-6">View</a>
      <i class="fas fa-minus text-white btn" onclick="toggleMinimize()"></i>
      <i class="fas fa-times btn btn-danger" onclick="closeContent()"></i>
    </div>
  </div>

  <div class="content-body">
    <form method="post" action="{% url 'edit_patient' patient.id %}">
      {% csrf_token %}
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Patient Name</label>
          <input class="form-control" id="patientName" name="patientName" maxlength="100"
                 value="{{ patient.name }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Age</label>
          <input type="number" class="form-control" id="patientAge" name="patientAge"
                 value="{{ patient.age }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Gender</label>
          <select class="form-control" id="patientGender" name="patientGender" required>
            <option value="">Select</option>
            <option {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
            <option {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
            <option {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email"
                 value="{{ patient.email }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="tel" class="form-control" id="patientPhone" name="patientPhone"
                 value="{{ patient.phone }}" pattern="^[6-9][0-9]{9}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Date of Admission</label>
          <input type="date" class="form-control" id="yearOfAdmission" name="dateOfAdmission"
                 value="{{ patient.date_of_admission|date:'Y-m-d' }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Address</label>
          <textarea class="form-control" id="patientAddress" name="patientAddress" rows="5" required>{{ patient.address }}</textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label">Country</label>
          <select class="form-control" name="country" id="countrySelect">
            <option value="">Select Country</option>
            {% for c in countries %}
              <option value="{{ c.id }}" {% if patient.country and patient.country.id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">State</label>
          <select class="form-control" name="state" id="stateSelect">
            <option value="">Select State</option>
            {% for s in states %}
              <option value="{{ s.id }}" {% if patient.state and patient.state.id == s.id %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">District</label>
          <select class="form-control" name="district" id="districtSelect">
            <option value="">Select District</option>
            {% for d in districts %}
              <option value="{{ d.id }}" {% if patient.district and patient.district.id == d.id %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label for="city" class="form-label">City</label>
          <input type="text" class="form-control" name="city" value="{{patient.city|default:''}}">
        </div>
        <!-- Hidden staff & branch -->
        <input type="hidden" name="staff_id" value="{{ patient.staff.id }}">
        <input type="hidden" name="branch_id" value="{{ patient.branch.id }}">

      </div>

      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary w-25">Update</button>
        <a href="{% url 'patienttable' %}" class="btn btn-secondary w-25">Cancel</a>
      </div>
    </form>
  </div>
</div>
{{ states|json_script:"states-data" }}
{{ districts|json_script:"districts-data" }}
<script>
document.addEventListener("DOMContentLoaded", function () {
  // Admission date auto-fill
  const admissionDate = document.getElementById("yearOfAdmission");
  const today = new Date().toISOString().split("T")[0];
  admissionDate.value = today;
  admissionDate.setAttribute("max", today);

  // --- Country → State → District Cascade ---
  const countrySelect = document.getElementById("countrySelect");
  const stateSelect = document.getElementById("stateSelect");
  const districtSelect = document.getElementById("districtSelect");

   const STATES = JSON.parse(document.getElementById("states-data").textContent);
  const DISTRICTS = JSON.parse(document.getElementById("districts-data").textContent);

  console.log("States:", STATES);
  console.log("Districts:", DISTRICTS);
});
</script>
<script>
  const STATES_BY_COUNTRY = {};
  JSON.parse(document.getElementById("states-data").textContent).forEach(s => {
    (STATES_BY_COUNTRY[s.country_id] ??= []).push(s);
  });

  const DISTRICTS_BY_STATE = {};
  JSON.parse(document.getElementById("districts-data").textContent).forEach(d => {
    (DISTRICTS_BY_STATE[d.state_id] ??= []).push(d);
  });

  function fillOptions(select, options, placeholder) {
    select.innerHTML = `<option value="">${placeholder}</option>`;
    if (!options) return;
    options.forEach(opt => {
      const el = document.createElement("option");
      el.value = opt.id;
      el.textContent = opt.name;
      select.appendChild(el);
    });
  }

  countrySelect.addEventListener("change", function () {
    const states = STATES_BY_COUNTRY[this.value] || [];
    fillOptions(stateSelect, states, "Select State");
    fillOptions(districtSelect, [], "Select District");
  });

  stateSelect.addEventListener("change", function () {
    const districts = DISTRICTS_BY_STATE[this.value] || [];
    fillOptions(districtSelect, districts, "Select District");
  });
  function closeContent() {
  window.location.href="{%url 'home'%}";
  document.getElementById("contentBox")?.remove();
}
</script>
{% endblock %}
