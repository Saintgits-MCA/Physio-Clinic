{% extends 'base.html' %}
{% block content %}
<div class="container mt-3" id="contentBox">
    <div class="bg-white shadow rounded">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center bg-primary text-white px-4 py-3 rounded-top">
            <h5 class="mb-0"><i class="fas fa-user-tag me-2"></i>Role Master</h5>
                <div class="d-flex gap-2">
            <a href="{% url 'role_table' %}" class="text-white fw-bold text-decoration-none me-3 fs-6">
                View
            </a>
            <button type="button" class="btn btn-sm btn-danger" onclick="closeContent()"><i
                    class="fas fa-times"></i></button>
            </div>

        </div>

        <!-- Form -->
        <form method="post" class="p-4">
            {% csrf_token %}
            <div class="row g-4">

                <!-- Role Name -->
                <div class="col-md-6">
                    <label for="role_name" class="form-label fw-bold">Role Name</label>
                    <input type="text" name="role_name" id="role_name" class="form-control"
                        placeholder="Enter role name" required>
                </div>

                <!-- Status -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">Status</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="status" id="statusActive" value="Active"
                            checked>
                        <label class="form-check-label" for="statusActive">Active</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="status" id="statusInactive" value="Inactive">
                        <label class="form-check-label" for="statusInactive">Inactive</label>
                    </div>
                </div>

                <!-- Submit -->
                <div class="col-12 d-flex justify-content-end">
                    <button type="submit" class="btn btn-success px-4"><i class="fas fa-plus me-1"></i>Add Role</button>
                </div>

            </div>
        </form>
    </div>
</div>
<script>
    function closeContent() {
  window.location.href="{%url 'home'%}";
  document.getElementById("contentBox")?.remove();
}
</script>
{% endblock %}
