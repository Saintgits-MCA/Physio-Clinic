
 {% extends 'Masters.html'%}
{%block contents%}
{% load static %}

</head>
<body>

<div class="content-box" id="contentBox">
  <div class="content-header">
    <span><i class="fas fa-flag me-2"></i>Country Master</span>
    <span>
      <a href="{%url 'countrytable'%}" class="text-white fw-bold text-decoration-none me-3 fs-6">View</a>
    </span>
  </div>
  <div class="content-body">
    <form method="post" action="{%url 'country'%}">
      {%csrf_token%}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Country Name</label>
          <input type="text" class="form-control" name="countryName" id="countryName" required>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary w-25">Add</button>
        <button type="reset" class="btn btn-danger w-25">Reset</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
{%endblock%}
