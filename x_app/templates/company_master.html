{% extends 'base.html' %}
{% block content %}
{% load static %}
<style>
  textarea { resize: none; }
</style>

<body>
  <div class="content-box" id="contentBox">
    <div class="content-header d-flex flex-wrap justify-content-between align-items-center">
      <div class="d-flex align-items-center flex-wrap gap-2">
        <i class="bi bi-building-fill me-2"></i>
        <span class="text-white">Company Master</span>
      </div>
      <div class="d-flex gap-2">
        <a href="{%url 'company_table'%}" class="text-white fw-bold text-decoration-none fs-6">View</a>
        <a class="btn btn-danger btn-sm mx-3" onclick="closeContent()">
          <i class="fas fa-times"></i>
        </a>
      </div>
    </div>

    <div class="content-body">
      <form method="post" action="{%url 'company_master'%}">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Company</label>
            <input type="text" step="0.01" class="form-control" name="company" required>
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary w-25">Add</button>
          <button type="reset" class="btn btn-danger w-25">Clear</button>
        </div>
      </form>
      
    </div>
  </div>

  <script>
    function closeContent() {
      window.location.href = "{% url 'home' %}";
      document.getElementById("contentBox")?.remove();
    }
  </script>

</body>
</html>
{% endblock %}
