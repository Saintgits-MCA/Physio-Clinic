{% extends 'Masters.html' %}
{% load static %}
{% block contents %}
<div class="content-box" id="contentBox">
  <div class="content-header d-flex flex-wrap justify-content-between align-items-center">
    <div class="d-flex align-items-center flex-wrap gap-2">
      <i class="fas fa-balance-scale"></i> <!-- Manual icon -->
      Add Expense Type
    </div>
    <div>
      <a href="{%url 'expensetype_table'%}" class="text-decoration-none text-white fw-bold me-3">View</a>
    </div>
  </div>

  <div class="content-body mt-3">
    <form method="POST" action="{%url 'add_expense_type'%}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="title" class="form-label">Expense Head</label>
        <input type="text" class="form-control" id="title" name="expense_type" required>
      </div>
      <button type="submit" class="btn btn-primary w-25">Add</button>
      <input type="reset" class="btn btn-danger text-white w-25" value="Reset">
    </form>
  </div>
 
</div>
{% endblock %}
