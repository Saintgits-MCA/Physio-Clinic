{% extends 'prescription_home.html' %}
{% block contents %}
{% load static %}

<div class="container">
  <div class="content-box">
 <div class="content-header mb-3">
      <h5><i class="fas fa-medkit me-2"></i>Basic Patient History</h5>
    </div>
    
<form method="post" class="px-2">
  {% csrf_token %}
  <div class="col-md-10">
      <label class="form-label">Selected Patient:</label>
      <span class="w-100 fw-bold">{%if selected_patient%} {{selected_patient.mr_no}}-{{selected_patient.name}} {%else%} None {%endif%}</span>
  </div>
  <div class="row g-3">
    
    <div class="col-md-6">
      <label class="form-label">Chief Complaints</label>
      <textarea class="form-control" type="text" name="chief_complaint" cols="15" rows="6" required></textarea>
    </div>
    <div class="col-md-6">
      <label class="form-label">Present History</label>
      <textarea class="form-control" type="text" name="present_history" cols="15" rows="6" required></textarea>
    </div>
    <div class="col-md-6">
      <label class="form-label">Past History</label>
      <textarea class="form-control" type="text" name="past_history" cols="15" rows="6" required></textarea>
    </div>
    <div class="col-md-6">
  <label class="form-label">Drug History</label>
<textarea name="drug_history" class="form-control" id="" cols="15" rows="6"></textarea>
</div>
<div class="col-md-6">
      <label class="form-label">Provisional Diagnosis</label>
      <textarea name="provisional_diagnosis" class="form-control" id="" cols="15" rows="6"></textarea>
</div> 
  </div>
  <button class="btn btn-primary my-5 w-25">Save</button>
  <button type="Reset" class="btn btn-danger w-25 mx-3">Reset</button>
</form>
  </div>
</div>
{% endblock %}
