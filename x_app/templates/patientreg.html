{% extends 'base.html'%}
{%block content%}
{%load static%}

<style>
  textarea {
    width: 340px;
  }
</style>

<body>
  <div class="content-box" id="contentBox">
    <div class="content-header d-flex flex-wrap justify-content-between align-items-center">
      <div class="d-flex align-items-center flex-wrap gap-2">
        <i class="fas fa-user-injured me-2"></i>
        <span class="fw-bold fs-5  text-white">Patient Registration</span>
      </div>
      <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
        <a href="{% url 'patienttable' %}" class="text-white fw-bold text-decoration-none fs-6">View</a>
        <i class="fas fa-minus text-white btn" onclick="toggleMinimize()"></i>
        <i class="fas fa-times btn btn-danger" onclick="closeContent()"></i>
      </div>
    </div>

    <div class="content-body">
      <form method="post" action="{%url 'patient' %}">
        {%csrf_token%}
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Patient Name</label><input class="form-control"
              id="patientName" name="patientName" maxlength="100" pattern="^[A-Za-z ]{4,100}$" required></div>
          <div class="col-md-6"><label class="form-label">Age</label><input type="number" class="form-control"
              id="patientAge" name="patientAge" required></div>
          <div class="col-md-6"><label class="form-label">Gender</label><select class="form-control" id="patientGender"
              name="patientGender" required>
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select></div>
          <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control"
              id="email" name="email" pattern="^[a-z][0-9]{5,15}+@gmail\.com$" required></div>
          <div class="col-md-6"><label class="form-label">Phone</label><input type="tel" class="form-control"
              id="patientPhone" name="patientPhone" pattern="^[6-9][0-9]{9}" required></div>
          <div class="col-md-6">
            <label class="form-label">Date of Admission</label>
            <input type="date" class="form-control" id="yearOfAdmission" name="dateOfAdmission" pattern="dd-mm-yyyy"
              required>
          </div>
          <div class="col-md-6"><label class="form-label">Address</label><textarea class="form-control"
              id="patientAddress" name="patientAddress" rows="5" cols="8" required></textarea></div>
          <div class="col-md-6">
            <label class="form-label">Country</label>
            <select class="form-control" name="country" id="countrySelect">
              <option value="">Select Country</option>
              {% for c in countries %}
              <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">State</label>
            <select class="form-control" name="state" id="stateSelect">
              <option value="">Select State</option>
              {% for s in states %}
              <option value="{{ s.id }}">{{ s.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">District</label>
            <select class="form-control" name="district" id="districtSelect">
              <option value="">Select District</option>
              {% for d in districts %}
              <option value="{{ d.id }}">{{ d.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label for="name" class="form-label">City Name(Optional)</label>
            <input type="text" class="form-control" name="city" maxlength="100" pattern="^[A-Za-z ]{5,100}$"
              value="{{ city.name }}">
          </div>
          <!-- Hidden staff & branch -->
          <input type="hidden" name="staff_id" value="{{ staff_id }}">
          <input type="hidden" name="branch_id" value="{{ branch_id }}">
        </div>

        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary w-25">Register</button>
          <button type="reset" class="btn btn-danger w-25">Clear</button>
        </div>
      </form>
    </div>
  </div>

</body>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const admissionDate = document.getElementById("yearOfAdmission");
    const today = new Date().toISOString().split("T")[0];
    admissionDate.value = today;
    admissionDate.setAttribute("max", today);
  });
</script>
{{ states|json_script:"states-data" }}
{{ districts|json_script:"districts-data" }}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Admission date auto-fill
    const admissionDate = document.getElementById("yearOfAdmission");
    const today = new Date().toISOString().split("T")[0];
    admissionDate.value = today;
    admissionDate.setAttribute("max", today);

    // --- Country → State → District Cascade ---
    const countrySelect = document.getElementById("countrySelect");
    const stateSelect = document.getElementById("stateSelect");
    const districtSelect = document.getElementById("districtSelect");

    const STATES = JSON.parse(document.getElementById("states-data").textContent);
    const DISTRICTS = JSON.parse(document.getElementById("districts-data").textContent);

    console.log("States:", STATES);
    console.log("Districts:", DISTRICTS);
  });
</script>
<script>
  const STATES_BY_COUNTRY = {};
  JSON.parse(document.getElementById("states-data").textContent).forEach(s => {
    (STATES_BY_COUNTRY[s.country_id] ??= []).push(s);
  });

  const DISTRICTS_BY_STATE = {};
  JSON.parse(document.getElementById("districts-data").textContent).forEach(d => {
    (DISTRICTS_BY_STATE[d.state_id] ??= []).push(d);
  });

  function fillOptions(select, options, placeholder) {
    select.innerHTML = `<option value="">${placeholder}</option>`;
    if (!options) return;
    options.forEach(opt => {
      const el = document.createElement("option");
      el.value = opt.id;
      el.textContent = opt.name;
      select.appendChild(el);
    });
  }

  countrySelect.addEventListener("change", function () {
    const states = STATES_BY_COUNTRY[this.value] || [];
    fillOptions(stateSelect, states, "Select State");
    fillOptions(districtSelect, [], "Select District");
  });

  stateSelect.addEventListener("change", function () {
    const districts = DISTRICTS_BY_STATE[this.value] || [];
    fillOptions(districtSelect, districts, "Select District");
  });
  function closeContent() {
  window.location.href="{%url 'home'%}";
  document.getElementById("contentBox")?.remove();
}

</script>


</html>
{%endblock%}
