{% extends 'Masters.html' %}
{% block contents %}
<div class="content-box">
  <div class="content-header">
    <span><i class="fas fa-code-branch me-2"></i>Edit Branch</span>
  </div>
  <div class="content-body">
    <form method="POST">{% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Branch Name</label>
        <input type="text" class="form-control" name="name" value="{{ branch.name }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" name="address" value="{{ branch.address }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Contact</label>
        <input type="text" class="form-control" name="contact" value="{{ branch.contact }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Incharge Name</label>
        <input type="text" class="form-control" name="incharge_name" value="{{ branch.incharge_name }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Incharge Phone</label>
        <input type="text" class="form-control" name="incharge_phone" value="{{ branch.incharge_phone }}">
      </div>

      <!-- Multiple department selection -->
      <div class="mb-3">
        <label class="form-label">Departments</label>
        <select name="departments" class="form-control" multiple>
          {% for dept in departments %}
            <option value="{{ dept.id }}" 
              {% if dept.id in selected_departments %}selected{% endif %}>
              {{ dept.name }}
            </option>
          {% endfor %}
        </select>
        <small class="text-muted">Hold Ctrl (Windows) or Cmd (Mac) to select multiple</small>
      </div>

      <button type="submit" class="btn btn-primary">Update</button>
      <a href="{% url 'branchtable' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
