{% extends 'Masters.html' %}
{% load static %}
{% block contents %}
<div class="content-box" id="contentBox">
  <div class="content-header d-flex flex-wrap justify-content-between align-items-center">
    <div class="d-flex align-items-center flex-wrap gap-2">
      <i class="fas fa-syringe"></i>
      <h4>Edit Hep</h4>
    </div>
    <div>
      <a href="{% url 'hep_list' %}" class="fw-bold text-white text-decoration-none">Back</a>
    </div>
  </div>

  <div class="content-body mt-3">
    <form method="POST" action="{% url 'hep_edit' item.id %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="name" class="form-label">Hep Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ item.name }}" required>
      </div>
      <button type="submit" class="btn btn-primary text-white w-25">Update</button>
      <button type="reset" class="btn btn-danger w-25">Reset</button>
    </form>
  </div>
</div>
{% endblock %}
