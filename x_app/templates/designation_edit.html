{% extends 'Masters.html' %}
{% block contents %}
<div class="content-box">
  <div class="content-header"> <span><i class="fas fa-user-tie me-2"></i>Edit Designation</span>
    <span>
      <a href="{%url 'designationtable'%}" class="text-white fw-bold text-decoration-none me-3 fs-6">View</a>
    </span></div>
  <div class="content-body">
    <form method="POST">{% csrf_token %}
      <div class="mb-3">
        <label for="name" class="form-label">Designation Name</label>
        <input type="text" class="form-control" name="name" value="{{ designation.Designation }}" required>
      </div>
      <button type="submit" class="btn btn-primary">Update</button>
      <a href="{% url 'designationtable' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
