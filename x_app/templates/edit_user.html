{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content-box">
  <div class="content-header d-flex justify-content-between align-items-center flex-wrap">
    <span class="fw-bold fs-5"><i class="fas fa-edit me-2"></i>Edit User</span>
    <div class="d-flex gap-2">
      <a href="{% url 'stafftable' %}" class="btn btn-secondary">← Back</a>
    </div>
  </div>

  <div class="content-body">
    <form method="POST">
      {% csrf_token %}
      <input type="hidden" name="branch_id" value="{{ user.branch_id }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="username" value="{{ user.name }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Gender</label>
          <select class="form-select" name="gender" required>
            <option value="">Select Gender</option>
            <option {% if user.gender == 'Male' %}selected{% endif %}>Male</option>
            <option {% if user.gender == 'Female' %}selected{% endif %}>Female</option>
            <option {% if user.gender == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
        </div>
        

        <div class="col-md-6">
          <label class="form-label">Age</label>
          <input type="number" class="form-control" name="age" value="{{ user.age }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Contact No</label>
          <input type="text" class="form-control" name="contact" value="{{ user.contact }}" maxlength="10" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Qualification Details</label>
          <input type="text" class="form-control" name="qualification_details" value="{{ user.qualification_details }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Joining Date</label>
          <input type="date" class="form-control" name="joining_date" value="{{ user.joining_date|date:'Y-m-d' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">PAN Card No</label>
          <input type="text" class="form-control" name="pancard" value="{{ user.pancard }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Address</label>
          <textarea class="form-control" name="address" rows="2">{{ user.address }}</textarea>
        </div>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary w-25">Update</button>
        <a href="{% url 'stafftable' %}" class="btn btn-danger w-25">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
