{% extends "base.html" %}
{% block content %}
<div class="container" style="min-height: 80vh;" id="contentBox">
    <div class="card  w-100" id="contentbox">
        <div class="card-header bg-primary text-white">
            <span class="fs-5  fw-normal">
                <i class="fas fa-lock me-2"></i> Change Password
            </span>
            <div class="float-end">
                <i class="fas fa-minus text-white btn me-2" onclick="toggleMinimize()"></i>
                <i class="fas fa-times btn btn-danger" onclick="closeContent()"></i>
            </div>
        </div>
        <div class="content-body p-4">
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Current Password</label>
                    <input type="password" name="current_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">New Password</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-25 rounded-pill">
                    <i class="fas fa-save me-1"></i> Update Password
                </button>
                  <button type="reset" class="btn btn-danger w-25 ms-2 rounded-pill">
                    <i class="fas fa-save me-1"></i> Clear
                </button>
            </form>
        </div>
    </div>
</div>


<style>
    .minimized .content-body {
        display: none;
    }
</style>

<script>
    function toggleMinimize() {
        const box = document.getElementById("contentbox");
        if (box) {
            box.classList.toggle("minimized");
        }
    }
 function closeContent() {
  window.location.href="{%url 'home'%}";
  document.getElementById("contentBox")?.remove();
}
</script>
{% endblock %}
