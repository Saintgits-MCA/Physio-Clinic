{% extends 'Masters.html' %}
{% block contents %}
<div class="content-box">
  <div class="content-header">
    <span><i class="fas fa-brain me-2"></i>Add Schroth Classification</span>
    <a href="{%url 'schroth_list'%}" class="text-decoration-none text-white fw-bold me-3">View</a>
  </div>
  <div class="content-body">
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Classification Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-25">Add</button>
      <button type="reset" class="btn btn-danger w-25">Reset</button>
    </form>
  </div>
</div>
<script>
  function closeContent() {
  window.location.href="{%url 'home'%}";
  document.getElementById("contentBox")?.remove();
}
</script>
{% endblock %}
