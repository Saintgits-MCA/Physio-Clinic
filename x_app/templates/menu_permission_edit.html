{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="content-box">
  <div class="content-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="fas fa-user-shield"></i>
      <span class="fw-bold fs-5">Edit Permissions — {{ role.name }}</span>
    </div>
    <div>
      <a href="{% url 'menu_allocation_table' %}" class="btn btn-secondary btn-sm">
        <i class="fas fa-arrow-left me-2"></i>Back
      </a>
    </div>
  </div>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead class="table-light">
          <tr>
            <th width="30%">Menu</th>
            <th class="text-center">View</th>
            <th class="text-center">Add</th>
            <th class="text-center">Edit</th>
            <th class="text-center">Delete</th>
          </tr>
        </thead>

        <tbody>
          {% for category, menus in menu_categories %}

            <!-- Category Row -->
            <tr class="table-primary fw-bold">
              <td>
                <div class="d-flex align-items-center gap-3">
                  <span>{{ category }}</span>
                  <!-- CATEGORY SELECT ALL -->
                  <input type="checkbox"
                         class="category-select"
                         data-category="{{ forloop.counter0 }}">
                </div>
              </td>
              <td class="text-center">
                <input type="checkbox" class="category-all"
                       data-type="view" data-category="{{ forloop.counter0 }}">
              </td>
              <td class="text-center">
                <input type="checkbox" class="category-all"
                       data-type="add" data-category="{{ forloop.counter0 }}">
              </td>
              <td class="text-center">
                <input type="checkbox" class="category-all"
                       data-type="edit" data-category="{{ forloop.counter0 }}">
              </td>
              <td class="text-center">
                <input type="checkbox" class="category-all"
                       data-type="delete" data-category="{{ forloop.counter0 }}">
              </td>
            </tr>

            <!-- Menu Items Under Category -->
            {% for menu in menus %}
            <tr data-category="{{ forloop.parentloop.counter0 }}">
              <td>{{ menu.name }}</td>

              <td class="text-center">
                <input type="checkbox"
                       class="perm-view"
                       name="menu_{{ menu.id }}_view"
                       {% if menu.id in view_ids %}checked{% endif %}>
              </td>

              <td class="text-center">
                <input type="checkbox"
                       class="perm-add"
                       name="menu_{{ menu.id }}_add"
                       {% if menu.id in add_ids %}checked{% endif %}>
              </td>

              <td class="text-center">
                <input type="checkbox"
                       class="perm-edit"
                       name="menu_{{ menu.id }}_edit"
                       {% if menu.id in edit_ids %}checked{% endif %}>
              </td>

              <td class="text-center">
                <input type="checkbox"
                       class="perm-delete"
                       name="menu_{{ menu.id }}_delete"
                       {% if menu.id in delete_ids %}checked{% endif %}>
              </td>
            </tr>
            {% endfor %}

          {% endfor %}
        </tbody>
      </table>
    </div>

    <div class="mt-3 m-3 text-end">
      <button type="submit" class="btn btn-success">
        <i class="fas fa-save"></i> Save Permissions
      </button>
    </div>
  </form>
</div>

<!-- JavaScript -->
<script>
document.addEventListener("DOMContentLoaded", function() {

  // Select All Under Category
  document.querySelectorAll(".category-select").forEach(catCheck => {
    catCheck.addEventListener("change", function() {
      let cat = this.dataset.category;
      let checked = this.checked;

      document.querySelectorAll(`tr[data-category='${cat}'] input[type='checkbox']`)
        .forEach(cb => cb.checked = checked);

      // sync header row (view/add/edit/delete)
      document.querySelectorAll(`.category-all[data-category='${cat}']`)
        .forEach(cb => cb.checked = checked);
    });
  });

  // Select Individual View/Add/Edit/Delete Column for Entire Category
  document.querySelectorAll(".category-all").forEach(headerCheck => {
    headerCheck.addEventListener("change", function() {
      let cat = this.dataset.category;
      let type = this.dataset.type;
      let checked = this.checked;

      document.querySelectorAll(`tr[data-category='${cat}'] .perm-${type}`)
        .forEach(cb => cb.checked = checked);
    });
  });

});
</script>

{% endblock %}
