{% extends 'Masters.html' %}
{% load static %}
{% block contents %}
<div class="content-box" id="contentBox">
  <div class="content-header d-flex flex-wrap justify-content-between align-items-center">
    <div class="d-flex align-items-center flex-wrap gap-2">
      <i class="fas fa-syringe"></i> <!-- Hep icon -->
      Hep Add
    </div>
    <div>
      <a href="{% url 'hep_list' %}" class="text-decoration-none text-white fw-bold me-3">View</a>
    </div>
  </div>

  <div class="content-body mt-3">
    <form method="POST" action="{% url 'hep_add' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="name" class="form-label">Hep Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <button type="submit" class="btn btn-primary w-25">Add</button>
      <input type="reset" value="Reset" class="w-25 btn btn-danger">
    </form>
  </div>
</div>
{% endblock %}
