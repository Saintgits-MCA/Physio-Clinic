
 {% extends 'Masters.html'%}
{%block contents%}
{% load static %}

</head>
<body>

<div class="content-box" id="contentBox">
  <div class="content-header">
    <span><i class="fas fa-map-marker-alt me-2"></i>State Master</span>
    <span>
      <a href="{%url 'stateTable'%}" class="text-white fw-bold text-decoration-none me-3 fs-6">View</a>
    </span>
  </div>
  <div class="content-body">
    <form method="post" action="{%url 'state'%}">
      {%csrf_token%}
      <div class="row g-3">
          <div class="col-md-6">
    <label class="form-label">Country</label>
    <select class="form-control" name="country" required>
      <option value="">Select Country</option>
      {% for c in countries %}
        <option value="{{ c.id }}">{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
        <div class="col-md-6">
          <label class="form-label">State Name</label>
          <input type="text" class="form-control" name="stateName" id="stateName" maxlength="100" pattern="^[A-Z]'\&'[a-z ]{5,100}$" placeholder="Enter State under chosen Country" required>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary w-25">Add</button>
        <button type="reset" class="btn btn-danger w-25">Reset</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
{%endblock%}
