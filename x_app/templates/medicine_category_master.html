{% extends 'base.html' %}
{% block content %}
<div class="container mt-3" id="contentBox">
    <div class="bg-white shadow rounded">

        <!-- Header -->
        <div class="content-header d-flex justify-content-between align-items-center bg-primary text-white px-4 rounded-top">
            <h5 class="mb-0"><i class="bi bi-tag-fill me-2"></i>Medicine Category Master</h5>
                <div class="gap-2">
            <a href="{%url 'medicine_category_list' %}" class="text-white fw-bold text-decoration-none me-3 fs-6">
                View
            </a>
            <button type="button" class="btn btn-sm btn-danger" onclick="closeContent()"><i
                    class="fas fa-times"></i></button>
            </div>

        </div>

        <!-- Form -->
        <form method="post" class="p-4">
            {% csrf_token %}
            <div class="row g-4">

                <!-- Category Name -->
                <div class="col-md-6">
                    <label for="medicine_category" class="form-label fw-bold">Medicine Category Name</label>
                    <input type="text" name="medicine_category" id="medicine_category" class="form-control"
                        placeholder="Enter Medicine Category name" required>
                </div>

                <!-- Submit -->
                <div class="col-12 d-flex justify-content-end">
                    <button type="submit" class="btn btn-success px-4"><i class="fas fa-plus me-1"></i>Add Medicine Category</button>
                    <button type="reset" class="btn btn-danger px-4 mx-2"><i class="fas fa-undo me-1"></i>Reset</button>

                </div>
            
            </div>
        </form>
    </div>
</div>
<script>
    function closeContent() {
  window.location.href="{%url 'home'%}";
  document.getElementById("contentBox")?.remove();
}
</script>
{% endblock %}
