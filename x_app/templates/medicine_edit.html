{% extends 'base.html' %}
{% block content %}
<div class="container mt-3" id="contentBox">

    <!-- Header -->
<div class="content-header d-flex flex-wrap justify-content-between align-items-center">
    <div class="d-flex align-items-center flex-wrap gap-2">
      <i class="bi bi-capsule"></i>
       Medicine Edit
    </div>
    <div>
      <a href="{% url 'medicine_table' %}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
</div>
<div class="content-body bg-white rounded">
    <!-- Form -->
    <form method="POST" class="row g-3">
      {% csrf_token %}

      <div class="col-md-4">
        <label class="form-label">Item Code</label>
        <input type="text" name="item_code" class="form-control" value="{{ medicine.item_code }}" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">HSN Code</label>
        <input type="text" name="hsn_code" class="form-control" value="{{ medicine.hsn_code }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Medicine Name</label>
        <input type="text" name="medicine_name" class="form-control" value="{{ medicine.medicine_name }}" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Category</label>
        <select name="category" class="form-select">
          <option value="">-- Select Category --</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}" {% if medicine.category.id == cat.id %}selected{% endif %}>
            {{ cat.name }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Generic Name</label>
        <input type="text" name="generic_name" class="form-control" value="{{ medicine.generic_name }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Rack Number</label>
        <input type="text" name="rack_number" class="form-control" value="{{ medicine.rack_number }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Base Unit</label>
        <input type="text" name="base_unit" class="form-control" value="{{ medicine.base_unit }}">
      </div>

      <div class="col-md-4">
        <label class="form-label">Tax</label>
        <select name="tax" class="form-select">
          <option value="">-- Select Tax --</option>
          {% for t in taxes %}
          <option value="{{ t.id }}" {% if medicine.tax.id == t.id %}selected{% endif %}>
            {{ t.tax_percent|floatformat:0 }}%
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Staff</label>
        <select name="staff" class="form-select">
          <option value="">-- Select Staff --</option>
          <option value="{{ staff.id }}" {% if medicine.staff_id == staff.id %}selected{% endif %}>
            {{ staff.name }}
          </option>
        </select>
      </div>

      <div class="col-12 text-center mt-4">
        <button type="submit" class="btn btn-primary px-4">
          <i class="fas fa-save me-2"></i>Update Medicine
        </button>
        <a href="{%url 'medicine_table'%}" class="btn btn-secondary ms-3 px-4">
          <i class="fas fa-undo me-2"></i>Cancel
        </a>
      </div>
    </form>
</div>
</div>
{% endblock %}
