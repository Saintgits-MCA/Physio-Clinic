{% extends 'staff_tabs_base.html' %}
{% block tab_content %}
{% with active_tab="allocation" %}
     
<form method="POST" action="{% url 'staff_allocation' %}">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-4 position-relative">
      <label class="form-label">Staff Name</label>
      <input type="text" id="staffSearch" class="form-control" placeholder="Search Staff by name...">
      <small id="staffSearchWarning" class="text-danger" style="display:none;">Please enter at least 3 characters.</small>
      <ul id="staffSuggestions" class="list-group position-absolute w-100" style="z-index: 1000; display:none; max-height: 200px; overflow-y: auto;"></ul>
      <select name="staff" id="staffSelect" class="d-none" required>
        <option value="">Select Staff</option>
        {% for s in staff_list %}
        <option value="{{ s.id }}" data-email="{{ s.email }}">{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Designation</label>
      <select name="designation" class="form-control" required>
        <option value="">Select Designation</option>
        {% for d in designations %}
        <option value="{{ d.id }}">{{ d.Designation }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Branches</label>
      <select name="branch" class="form-control" required>
        <option value="">Select Branches</option>
        {% for branch in branches %}
        <option value="{{ branch.id }}">{{ branch.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Department</label>
      <select name="department" class="form-control" required>
        <option value="">Select Department</option>
        {% for dept in departments %}
        <option value="{{ dept.id }}">{{ dept.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Status</label>
      <select name="status" class="form-control" required>
        <option value="">Select Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Username</label>
      <input type="email" class="form-control bg-secondary-subtle" name="email" id="staffEmail" readonly required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" id="password" onkeyup="togglePassword()" required>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-success w-25" id="submit">
      <i class="fas fa-save me-1"></i> Allocate
    </button>
    <button type="reset" class="btn btn-danger w-25">
      <i class="fas fa-undo me-1"></i> Reset
    </button>
  </div>
</form>

<script>
  const passwordInput = document.getElementById("password");
  function togglePassword() {
    const type = passwordInput.type === "password" ? "text" : "password";
    passwordInput.type = type;
  }

  document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("staffSearch");
    const warning = document.getElementById("staffSearchWarning");
    const submit=document.getElementById("submit");
    const staffSelect = document.getElementById("staffSelect");
    const suggestions = document.getElementById("staffSuggestions");
    const emailInput = document.getElementById("staffEmail");

    searchInput.addEventListener("input", function () {
      const query = this.value.trim().toLowerCase();
      suggestions.innerHTML = "";
      suggestions.style.display = "none";

      if (query.length > 0 && query.length < 3) {
        warning.style.display = "block";
        staffSelect.value = "";
        emailInput.value = "";
        return;
      }
      warning.style.display = "none";

      if (query.length >= 3) {
        const matches = Array.from(staffSelect.options).filter(option =>
          option.textContent.toLowerCase().includes(query) && option.value !== ""
        );

        if (matches.length > 0) {
          matches.forEach(option => {
            const li = document.createElement("li");
            li.classList.add("list-group-item", "list-group-item-action");
            li.textContent = option.textContent;
            li.addEventListener("click", function () {
              searchInput.value = option.textContent;
              staffSelect.value = option.value;
              emailInput.value = option.dataset.email || "";
              suggestions.style.display = "none";
            });
            suggestions.appendChild(li);
          });
          suggestions.style.display = "block";
        }
      }
    });

    document.addEventListener("click", function (event) {
      if (!event.target.closest("#staffSearch") && !event.target.closest("#staffSuggestions")) {
        suggestions.style.display = "none";
      }
    });

    staffSelect.addEventListener("change", function () {
      const selectedOption = this.options[this.selectedIndex];
      emailInput.value = selectedOption.getAttribute("data-email") || "";
    });

    submit.addEventListener("click", function (event) {
      if (!staffSelect.value) {
        event.preventDefault();
        warning.textContent = "⚠️ Select a staff before allocating.";
        warning.style.display = "block";
        searchInput.focus();
      }
    });
  });
  
</script>
{% endwith %}
{% endblock %}
