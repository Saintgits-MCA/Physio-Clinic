{% extends 'base.html' %}
{% load static %}
{% block content %}

<script src="{% static 'js/index.global.min.js' %}"></script>

<style>
  /* ---- Calendar Container ---- */
  #calendar {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
    overflow: hidden;
  }

  #calendar:hover {
    box-shadow: 0 10px 35px rgba(33, 150, 243, 0.2);
    transform: scale(1.003);
  }

  .fc-toolbar.fc-header-toolbar {
    margin-bottom: 15px !important;
  }

  .fc-toolbar-chunk {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Make arrows tight around title */
  .fc-toolbar-title {
    font-size: 1.8rem !important;
    font-weight: 800 !important;
    letter-spacing: 0.4px;
    margin: 0 10px !important;
  }

  .fc-prev-button, .fc-next-button {
    background: none !important;
    border: none !important;
    color:white;
    font-size: 1.4rem !important;
    box-shadow: none !important;
  }

  .fc-prev-button:hover, .fc-next-button:hover {
    color: white !important;
    transform: scale(1.2);
  }

  /* Remove underline & focus highlights */
  #calendar a, .fc-button, .fc-daygrid-day-number {
    text-decoration: none !important;
  }

  #calendar a:focus, #calendar a:hover {
    text-decoration: none !important;
  }

  .fc-button-primary {
    background: linear-gradient(135deg, #71b5ecff, #1976d2) !important;
    border: none !important;
    border-radius: 10px !important;
    font-weight: 500 !important;
    text-transform: capitalize;
    padding: 6px 12px !important;
    transition: 0.25s ease-in-out;
  }

  .fc-button-primary:hover {
    background: linear-gradient(135deg, #1565c0, #0d47a1) !important;
    transform: scale(1.05);
  }

  .fc-theme-standard td, .fc-theme-standard th {
    border-color: #e3f2fd !important;
  }

  .fc-day-today {
    background: linear-gradient(135deg, #e3f2fd, #bbdefb) !important;
    border-radius: 10px;
    font-weight: 600;
  }

  .fc-daygrid-day-frame {
    transition: 0.2s ease-in-out;
    border-radius: 10px;
  }

  .fc-daygrid-day:hover {
    background-color: #f5f9ff !important;
    cursor: pointer;
    transform: scale(1.01);
  }

  .fc-event {
    background: linear-gradient(135deg, #2196f3, #1976d2) !important;
    border: none !important;
    border-radius: 8px !important;
    font-size: 0.85rem;
    padding: 4px 6px;
    color: #fff !important;
    box-shadow: 0 2px 6px rgba(25, 118, 210, 0.3);
    transition: 0.2s;
    text-decoration: none !important;
  }

  .fc-event:hover {
    background: linear-gradient(135deg, #1565c0, #0d47a1) !important;
    transform: translateY(-2px);
  }

  #calendar {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlideIn 0.6s ease forwards;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="content-box" id="contentBox">
  <div class="content-header d-flex justify-content-between align-items-center flex-wrap gap-2">
  <div class="d-flex align-items-center gap-2">
    <i class="fas fa-calendar-alt fs-5"></i>
    <span class="fw-bold fs-5">Calendar</span>
  </div>

  <div class="d-flex gap-2 align-items-center">

    <!-- 🔹 STAFF FILTER -->
    <form method="get" class="d-flex gap-2 align-items-center">
  <select name="staff" class="form-select form-select-sm" onchange="this.form.submit()">
    <option value="" >All Staff</option>
    {% for s in staff_list %}
      <option value="{{ s.staff.id }}"
        {% if selected_staff == s.staff.id|stringformat:"s" %}selected{% endif %}>
        {{ s.staff.name }}
      </option>
    {% endfor %}
  </select>
</form>

    <i class="fas fa-times btn btn-danger" onclick="closeContent()"></i>
  </div>
</div>


  <div class="content-body mt-4 position-relative">
    <div id="calendar"></div>
  </div>
</div>

{% comment %} <script>
document.addEventListener("DOMContentLoaded", function () {
    const calendarEl = document.getElementById("calendar");

    // Get appointments from Django context
    const appointmentsPerDate = {{ appointments_per_date|safe }};

    // Convert to FullCalendar events
    const events = Object.keys(appointmentsPerDate).map(date => ({
        title: appointmentsPerDate[date] + ' Appointment' + (appointmentsPerDate[date] > 1 ? 's' : ''),
        start: date,
        allDay: true,
        url: "{% url 'appointmenttable' %}?date=" + date
    }));

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        selectable: true,
        editable: true,
        headerToolbar: {
            left: "",
            center: "prev title next",
            right: "today"
        },
        buttonText: {
            today: "Today"
        },
        events: events,
        contentHeight: "auto",
        expandRows: true
    });

    calendar.render();
});
</script> {% endcomment %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const calendarEl = document.getElementById("calendar");
    const appointmentsPerDate = {{ appointments_per_date|safe }};
    const selectedStaff = "{{ selected_staff|default:'' }}";

    const events = Object.keys(appointmentsPerDate).map(date => ({
        title: appointmentsPerDate[date] + ' Appointment' +
               (appointmentsPerDate[date] > 1 ? 's' : ''),
        start: date,
        allDay: true,
        url: "{% url 'appointmenttable' %}?date=" + date + "&staff=" + selectedStaff
    }));

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        headerToolbar: {
            left: "",
            center: "prev title next",
            right: "today"
        },
        events: events,
        contentHeight: "auto"
    });

    calendar.render();
});

function closeContent() {
  window.location.href="{%url 'home'%}";
  document.getElementById("contentBox")?.remove();
}
</script>
{% endblock %}
