{% extends 'staff_tabs_base.html' %}
{% block tab_content %}
{% with active_tab="registration" %}

   
<form method="POST" action="{% url 'staff_registration' %}">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" name="username" maxlength="100" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Gender</label>
      <select class="form-control" name="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Age</label>
      <input type="number" name="age" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Contact No</label>
      <input type="text" name="contact" class="form-control" maxlength="10" pattern="\d{10}" title="10-digit mobile number" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">PAN Card Number</label>
      <input type="text" name="pancard" class="form-control" pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" title="Enter valid PAN format e.g. ABCDE1234F" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" rows="3" required></textarea>
    </div>
    <div class="col-md-4">
      <label class="form-label">Qualification Details</label>
      <textarea name="qualification_details" class="form-control" rows="1" placeholder="e.g., MBBS, BSc Nursing" required></textarea>
    </div>
    <div class="col-md-4">
      <label class="form-label">Joining Date</label>
      <input type="date" name="joining_date" class="form-control" required>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary w-25">
      <i class="fas fa-user-plus me-1"></i> Register
    </button>
    <button type="reset" class="btn btn-danger w-25">
      <i class="fas fa-undo me-1"></i> Reset
    </button>
  </div>
</form>
{% endwith %}


<script>
  const passwordInput = document.getElementById("password");
  function togglePassword() {
    const type = passwordInput.type === "password" ? "text" : "password";
    passwordInput.type = type;
  }


  document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("staffSearch");
    const warning = document.getElementById("staffSearchWarning");
    const staffSelect = document.getElementById("staffSelect");
    const suggestions = document.getElementById("staffSuggestions");
    const emailInput = document.getElementById("staffEmail");

    searchInput.addEventListener("input", function () {
      const query = this.value.trim().toLowerCase();

      // Clear previous suggestions
      suggestions.innerHTML = "";
      suggestions.style.display = "none";

      if (query.length > 0 && query.length < 3) {
        warning.style.display = "block";
        staffSelect.value = "";
        emailInput.value = "";
        return;
      }
      warning.style.display = "none";

      if (query.length >= 3) {
        const matches = Array.from(staffSelect.options).filter(option =>
          option.textContent.toLowerCase().includes(query) && option.value !== ""
        );

        if (matches.length > 0) {
          matches.forEach(option => {
            const li = document.createElement("li");
            li.classList.add("list-group-item", "list-group-item-action");
            li.textContent = option.textContent;
            li.addEventListener("click", function () {
              searchInput.value = option.textContent;
              staffSelect.value = option.value;
              emailInput.value = option.dataset.email || "";
              suggestions.style.display = "none";
            });
            suggestions.appendChild(li);
          });
          suggestions.style.display = "block";
        }
      }
    });

    // Hide suggestions if clicked outside
    document.addEventListener("click", function (event) {
      if (!event.target.closest("#staffSearch") && !event.target.closest("#staffSuggestions")) {
        suggestions.style.display = "none";
      }
    });

    // Keep existing select-change email autofill
    staffSelect.addEventListener("change", function () {
      const selectedOption = this.options[this.selectedIndex];
      emailInput.value = selectedOption.getAttribute("data-email") || "";
    });
  });
</script>

{% endblock %}
