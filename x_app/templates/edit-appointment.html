{% extends 'base.html' %}
{% load static %}
{% block content %}
<script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>

<div class="content-box">
    <div class="content-header d-flex justify-content-between align-items-center">
        <h5><i class="fas fa-edit me-2"></i>Edit Appointment</h5>
        <a href="{% url 'appointmenttable' %}" class="btn btn-secondary">← Back</a>
    </div>

    <div class="content-body">
        <form method="POST">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label>Token No</label>
                    <input name="tokenNo" class="form-control" value="{{ appointment.token_no }}" readonly>
                </div>

                <div class="col-md-6">
                    <label>Patient</label>
                    <input class="form-control" value="{{ appointment.patient.name }}" readonly>
                </div>

                <div class="col-md-6">
                    <label>Age</label>
                    <input class="form-control" value="{{ appointment.patient.age }}" readonly>
                </div>

                <div class="col-md-6">
                    <label>Appointment Date</label>
                    <input type="date" name="appointmentDate" class="form-control"
                        value="{{ appointment.appointment_date|date:'Y-m-d' }}" required>
                </div>

                 <div class="col-md-6">
          <label>Appointment Time</label>
          <input type="time" id="timeofvisit" name="appointmentTime" class="form-control" value="{{ appointment.appoinment_time|time:"H:i" }}" required>
        </div>

                <div class="col-md-6">
                    <label>Branch</label>
                    <select id="branchSelect" name="branch" class="form-control" required>
                        <option value="">Select Branch</option>
                        {% for branch in branches %}
                        <option value="{{ branch.id }}" {% if appointment.branch.id == branch.id %}selected{% endif %}>
                            {{ branch.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Department</label>
                    <select id="departmentSelect" name="department" class="form-control" required>
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}" {% if appointment.department.id == dept.id %}selected{% endif %}>
                            {{ dept.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Doctor</label>
                    <select id="doctorSelect" name="doctorName" class="form-control" required>
                        <option value="">Select Doctor</option>
                        {% for doc in doctors %}
                        <option value="{{ doc.id }}" {% if appointment.doctor.id == doc.id %}selected{% endif %}>
                            {{ doc.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Status</label>
                    <select name="status" class="form-control" required>
                        <option value="Consultation" {% if appointment.status == 'Consultation' %}selected{% endif %}>Consultation</option>
                        <option value="Followup" {% if appointment.status == 'Followup' %}selected{% endif %}>Followup</option>
                        <option value="Massage" {% if appointment.status == 'Massage' %}selected{% endif %}>Massage</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Contact No</label>
                    <input name="contactNo" class="form-control" value="{{ appointment.contact_no }}" required>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary w-25">Update</button>
                <a href="{% url 'appointmenttable' %}" class="btn btn-danger">Cancel</a>

            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const branchSelect = document.getElementById("branchSelect");
    const departmentSelect = document.getElementById("departmentSelect");
    const doctorSelect = document.getElementById("doctorSelect");

    // Load departments on branch change
    branchSelect.addEventListener("change", function () {
        fetch(`/get-departments-by-branch/${this.value}/`)
            .then(res => res.json())
            .then(data => {
                departmentSelect.innerHTML = '<option value="">Select Department</option>';
                (data.departments || []).forEach(d => {
                    let opt = document.createElement("option");
                    opt.value = d.id;
                    opt.textContent = d.name;
                    departmentSelect.appendChild(opt);
                });
            });
    });

    // Load doctors on department change
    departmentSelect.addEventListener("change", function () {
        const branchId = branchSelect.value;
        const departmentId = departmentSelect.value;
        let dropdown = $('#doctorSelect');

        dropdown.empty().append('<option selected disabled>Loading...</option>');

        if (branchId && departmentId) {
            $.ajax({
                type: 'GET',
                url: "{% url 'get_doctors_by_department' %}",
                data: { branch_id: branchId, dept_id: departmentId },
                success: function (data) {
                    dropdown.empty().append('<option value="">Select</option>');
                    if (data.doctors && data.doctors.length > 0) {
                        data.doctors.forEach(function (item) {
                            dropdown.append(`<option value="${item.staff_id}">${item.name}</option>`);
                        });
                    } else {
                        dropdown.append('<option disabled>No doctors found</option>');
                    }
                },
                error: function (xhr) {
                    dropdown.empty().append('<option value="" selected disabled>Error fetching doctors</option>');
                    console.error("Error fetching doctors:", xhr.responseText);
                }
            });
        }
    });
});
</script>
{% endblock %}
