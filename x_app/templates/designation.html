 {% extends 'Masters.html' %}
{%block contents%}
{%load static%}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Designation Title</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <script src="{%static 'js/xlsx.full.min.js'%}"></script>
  <script src="{%static 'js/jspdf.umd.min.js'%}"></script>
  <link href="{%static 'css/all.min.css'%}" rel="stylesheet">
  <script src="{%static 'js/html2canvas.min.js'%}"></script>
  <script src="{% static 'js/base.js' %}"></script>
</head>
<body>

<div class="content-box" id="contentBox">
  <div class="content-header">
    <span><i class="fas fa-briefcase me-2"></i>Designation Title</span>
    <span>
      <a href="{%url 'designationtable'%}" class="text-white fw-bold text-decoration-none me-3 fs-6">View</a>
    </span>
  </div>
  <div class="content-body">
    <form method="POST" action="{%url 'designation'%}">
      {%csrf_token%}
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Designation Title</label>
          <input type="text" class="form-control" name="title" id="designationTitle" required>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary w-25">Add</button>
        <button type="reset" class="btn btn-danger w-25">Reset</button>
      </div>
    </form>
  </div>
</div>

<script>
  const designations = [];

  function registerDesignation(e) {
    e.preventDefault();
    const title = document.getElementById("designationTitle").value;
    designations.push({ title });
    alert("Designation successfully added!");
    e.target.reset();
  }

  

  function reloadPanel(){ location.reload(); }
</script>

</body>
</html>
{%endblock%}
