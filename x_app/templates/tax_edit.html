{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Tax</h5>
      <a href="{% url 'tax_table' %}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left me-2"></i> Back</a>
    </div>
    <div class="card-body">
      <form method="POST" class="row g-3">
        {% csrf_token %}
        <div class="col-md-6">
          <label class="form-label fw-bold">Tax Percentage (%)</label>
          <input type="number" step="0.01" name="tax_percentage" class="form-control" value="{{ tax.tax_percent |floatformat:0}}" required>
        </div>
        <div class="col-12 text-end mt-3">
          <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Update</button>
          <a href="{% url 'tax_table' %}" class="btn btn-danger ms-5"><i class="fas fa-undo me-2 "></i> Cancel</a>

        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
