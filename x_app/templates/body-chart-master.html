{% extends 'Masters.html' %}
{% load static %}
{% block contents %}
<div class="content-box" id="contentBox">
  <div class="content-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="fas fa-image me-2"></i>
      <span class="text-white">Body Chart Master</span>
    </div>
  </div>

  <div class="content-body">
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label for="image" class="form-label">Upload Body Chart Image</label>
        <input type="file" class="form-control" name="image" accept="image/*" required>
      </div>
      <div class="mb-3">
        <label for="title" class="form-label">Image Title</label>
        <input type="text" class="form-control" name="title" placeholder="e.g., Anterior View" required>
      </div>
      <button type="submit" class="btn btn-primary">Upload</button>
    </form>

    <hr>
    <h5 class="mt-4">Uploaded Body Charts</h5>
    <div class="row">
      {%if charts%}
      {% for chart in charts %}
<div class="col-md-4">
  <div class="card w-75 p-3">
    <img src="{{ chart.image.url }}" class="card-img-top w-50 mt-3 mx-auto" alt="{{ chart.title }}">
    <div class=" text-center">
      <p class="card-text">{{ chart.title }}</p>

      <a href="{% url 'delete_body_chart' chart.id %}"
         class="btn btn-danger mt-0"
         onclick="return confirm('Are you sure you want to delete this body chart image?');">
        <i class="fas fa-trash-alt me-1"></i>Delete
      </a>
    </div>
  </div>
</div>

{% endfor %}
{%else%}
 NA
  {%endif%}
    </div>
  </div>
</div>
{% endblock %}
