{% extends 'base.html' %}
{% block content %}

<div class="content-box" id="contentBox">
  <!-- Header -->
  <div class="content-header d-flex justify-content-between align-items-center px-3 pt-2">
    <div class="d-flex align-items-center gap-2">
      <i class="fas fa-truck text-white"></i>
      <span class="fw-bold fs-5 text-white">Supplier Master</span>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <a href="{% url 'supplier_list' %}" class="text-light fw-bold text-decoration-none me-3" title="View">
        View
      </a>

      <button class="btn btn-danger btn-sm d-flex align-items-center px-2" onclick="closeContent()"
        title="Close">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <!-- Form Card -->
  <div class="content-body py-3">
        <form method="POST" action="{% url 'supplier_master' %}" class="row g-3">
          {% csrf_token %}
          <!-- Left Column -->
          <div class="col-md-6">
            <label class="form-label fw-bold">Supplier Code</label>
            <input type="text" name="supplier_code" class="form-control" placeholder="Enter Supplier Code" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Supplier Name</label>
            <input type="text" name="supplier_name" class="form-control" placeholder="Enter Supplier Name" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Contact Number</label>
            <input type="tel" name="contact_number" class="form-control" placeholder="Enter Contact Number"
              maxlength="10" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter Email" required>
          </div>

          <div class="col-md-12">
            <label class="form-label fw-bold">Address</label>
            <textarea name="address" rows="3" class="form-control" placeholder="Enter Address" required></textarea>
          </div>

          <div class="text-start">
            <button type="submit" class="btn btn-success">
              <i class="fas fa-save me-2"></i> Submit
            </button>
            <button type="reset" class="btn btn-danger">
              <i class="fas fa-eraser me-2"></i> Reset
            </button>
          </div>
        </form>
      </div>
</div>

<script>
  function closeContent() {
    document.getElementById('contentBox').remove();
  }
</script>

{% endblock %}
