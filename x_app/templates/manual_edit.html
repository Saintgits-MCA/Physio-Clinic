{% extends 'Masters.html' %}
{% load static %}
{% block contents %}
<div class="content-box" id="contentBox">
  <div class="content-header d-flex flex-wrap justify-content-between align-items-center">
    <div class="d-flex align-items-center flex-wrap gap-2">
      <i class="fas fa-book"></i>
      Edit Manual
    </div>
    <div>
      <a href="{% url 'manual_list' %}" class="btn btn-primary btn-sm">Back to List</a>
    </div>
  </div>

  <div class="content-body mt-3">
    <form method="POST" action="{% url 'manual_edit' item.id %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="title" class="form-label">Manual Title</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ item.title }}" required>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3">{{ item.description }}</textarea>
      </div>
      <button type="submit" class="btn btn-success">Update</button>
    </form>
  </div>
</div>
{% endblock %}
