{% extends 'Masters.html' %}
{% block contents %}
{% load static %}

<div class="content-box" id="contentBox">
  <div class="content-header">
    <span><i class="fas fa-file-invoice me-2"></i>Invoice Particular</span>
    <span>
      <a href="{% url 'invoice_particular_list' %}"
         class="text-white fw-bold text-decoration-none me-3 fs-6">View</a>
    </span>
  </div>

  <div class="content-body">
    <form method="POST">
      {% csrf_token %}
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Particular Name</label>
          <input type="text" class="form-control" name="name" required>
        </div>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary w-25">Add</button>
        <button type="reset" class="btn btn-danger w-25">Reset</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
